spring:
  datasource:
    url: jdbc:postgresql://db:5432/comma
    username: dev
    password: dev123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-only # 개발용, 실행 시 테이블 초기화
    show-sql: true # 개발용, 런타임에서 로그 보기 어려우면 false로 비활성화

  #  flyway:
  #    enabled: true
  #    locations: classpath:db/migration
  data:
    redis:
      host: redis
      port: 6379
      password: ""
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
          max-wait: -1ms


  springdoc:
    swagger-ui:
      enabled: true
      path: /swagger-ui.html
      operations-sorter: method
      tags-sorter: alpha
    api-docs:
      path: /v3/api-doc
    enabled: true

server:
  port: 8080
  servlet:
    context-path: /api
  address: 0.0.0.0

# 로깅 설정
logging:
  level:
    root: INFO
    groom.backend: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/application.log  # Docker 볼륨 마운트 경로
    max-size: 10MB
    max-history: 30