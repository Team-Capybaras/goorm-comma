name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra files
        uses: actions/checkout@v4

      - name: Copy infra files and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -e

            BASE_DIR=/srv/app
            mkdir -p $BASE_DIR
            cd $BASE_DIR

            echo ">>> Sync infra files"

            if [ ! -f docker-compose.prod.yml ]; then
              echo ">>> docker-compose.prod.yml not found. copying..."
              cat > docker-compose.prod.yml << 'EOF'
            $(sed 's/^/            /' docker-compose.prod.yml)
            EOF
            fi

            if [ ! -f .env.prod ]; then
              echo ">>> .env.prod not found. copying..."
              cat > .env.prod << 'EOF'
            $(sed 's/^/            /' .env.prod)
            EOF
            fi

            if [ ! -f prod.sh ]; then
              echo ">>> prod.sh not found. copying..."
              cat > prod.sh << 'EOF'
            $(sed 's/^/            /' prod.sh)
            EOF
              chmod +x prod.sh
            fi

            echo ">>> Run prod.sh pull"
            ./prod.sh pull
