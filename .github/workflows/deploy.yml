name: Deploy to EC2

on:
  push:
    branches:
      - prod
#build-push.yml 구현 후 아래로 변경ㅌ
#  workflow_run:
#    workflows: ["Build and Push Image"]
#    types:
#      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -e

            docker pull username/goorm_comma:latest

            docker stop goorm_comma || true
            docker rm goorm_comma || true

            docker run -d \
              --name goorm_comma \
              -p 8080:8080 \
              username/goorm_comma:latest
