volumes:
  db_data:
  redis_data:
  loki_data:
  grafana_data:
  app_logs:  # 애플리케이션 로그 공유 볼륨

networks:
  goorm:
    driver: bridge

services:
  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - goorm

  backend:
    image: kmgyu/goorm-comma-be:latest
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Seoul
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul
    depends_on:
      - db
      - redis
    networks:
      - goorm
    volumes:
      - ./backend/src:/app/src
      - app_logs:/app/logs  # 로그 디렉토리를 공유 볼륨으로 마운트

  frontend:
    image: kmgyu/goorm-comma-fe:latest
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - TZ=Asia/Seoul
    env_file:
      - .env.prod
    networks:
      - goorm

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    environment:
      - TZ=Asia/Seoul
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - goorm

  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - goorm

  # Loki - 로그 집계 시스템
  loki:
    container_name: loki
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    environment:
      - TZ=Asia/Seoul
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - goorm
    restart: unless-stopped

  # Grafana - 로그 시각화
  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - TZ=Asia/Seoul
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./backend/monitoring/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - loki
    networks:
      - goorm
    restart: unless-stopped

  # Alloy - 로그 수집 에이전트
  alloy:
    container_name: alloy
    image: grafana/alloy:latest
    ports:
      - "12345:12345" # Alloy UI
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./backend/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - app_logs:/app/logs:ro  # Backend 로그와 공유 볼륨 마운트 (읽기 전용)
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
      - backend
    networks:
      - goorm
    restart: unless-stopped